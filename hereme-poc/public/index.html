<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1113">
  <meta name="description" content="HerEme. En lokal plakatvegg for spørsmål, meninger, historier, varsler og tips.">
  <title>HerEme · Plakatveggen</title>
  <script src="/preferences.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/pwa/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="/styles.css">
  <script src="/icons.js" defer></script>
  <script src="/themes.js" defer></script>
  <script src="/poster.js" defer></script>
  <script src="/feed.js" defer></script>
  <script src="/shell.js" defer></script>
  <script src="/compose.js" defer></script>
  <script src="/detail.js" defer></script>
  <script src="/locations.js" defer></script>
  <script src="/passkeys.js" defer></script>
  <script src="/auth.js" defer></script>
  <script src="/pwa.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#mainContent">Hopp til veggen</a>
  <header class="masthead">
    <div class="utility-line"><span>HEREME / DET FOLK SNAKKER OM</span><span>STAVANGER + SANDNES / LOKAL DEMO</span></div>
    <div class="masthead-inner">
      <button class="logo" data-action="home" aria-label="HerEme, vis hele veggen"><span class="brand-mark">H</span><span>hereme<em>.</em></span></button>
      <label class="header-search"><span class="sr-only">Søk i innlegg</span><input id="searchInput" type="search" maxlength="100" placeholder="Søk på veggen …"></label>
      <label class="sort-control"><span>Sorter</span><select id="sortSelect"><option value="new">Nyeste</option><option value="hot">På gang</option><option value="top">Topp</option></select></label>
      <div class="header-actions">
        <a class="btn btn-secondary" href="/chat">Chat</a>
        <button class="notification-button" id="notificationButton" data-action="notifications" aria-label="Varslinger" hidden><img src="/assets/icons/notification.svg" alt=""><span id="notificationBadge" hidden></span></button>
        <button class="filter-toggle" id="filterToggle" data-action="toggle-filters" aria-controls="leftPanel" aria-expanded="false" aria-label="Vis kategorifiltre"><span data-icon="filter"></span><span id="filterCount"></span></button>
        <button class="btn btn-secondary" id="areaButton" data-action="areas" hidden>Områder</button>
        <button class="btn btn-primary create-button" data-action="compose" aria-label="Legg ut"><span data-icon="plus"></span><span class="create-label">Ny plakat</span></button>
        <button class="profile-chip" data-action="profile" aria-label="Din profil"><span id="profileMonogram">○</span><span id="profileLabel">Bli med</span></button>
        <button class="menu-button" data-action="menu" aria-label="Åpne meny"><span data-icon="menu"></span></button>
      </div>
    </div>
  </header>
  <div class="display-preferences" aria-label="Visningsvalg">
    <div class="view-switch" role="group" aria-label="Skrivebordsvisning"><button data-action="layout" data-layout="simple">Enkel</button><button data-action="layout" data-layout="advanced">Avansert</button></div>
    <button id="themeToggle" data-action="theme" aria-label="Lys modus" aria-pressed="false">Lys modus</button>
  </div>
  <div class="forum-shell" id="forumShell">
    <aside class="left-panel" id="leftPanel" aria-label="Navigasjon og kategorier">
      <nav class="desktop-navigation" aria-label="Utforsk"><p class="eyebrow">Nabolaget</p><button class="nav-link" data-action="home"><span data-icon="grid"></span> Hele veggen</button><button class="nav-link" data-action="compose"><span data-icon="plus"></span> Legg ut</button></nav>
      <fieldset class="category-filters"><legend>Kategorier</legend><div id="categoryFilters"></div></fieldset>
      <button class="text-button reset-filters" data-action="reset-filters">Vis alle kategorier ↗</button>
      <div class="desktop-navigation sidebar-note"><p class="eyebrow">Plass til alle</p><p>Et spørsmål. Et øyeblikk. En god drøs.</p><p class="muted-note">Demobilder og fiktive innlegg er merket. Rapporter innhold inne i innlegget.</p><button class="text-button" data-action="menu">Om HerEme / mobiladresse ↗</button></div>
    </aside>
    <main id="mainContent" tabindex="-1">
      <nav id="simpleCategories" class="simple-categories" aria-label="Kategorier"></nav>
      <div class="wall-toolbar"><h1><i class="live-dot"></i> Plakatveggen</h1><span><b id="feedCounter"></b> innlegg</span></div>
      <div id="feed" class="poster-wall" aria-label="Innlegg på veggen" aria-live="polite"><p class="loading-card">Henter veggen …</p></div>
    </main>
    <aside class="right-panel" id="rightPanel" aria-label="Samtaler og aktivitet"><div id="activityPanel"></div></aside>
  </div>
  <main id="profileRoot" class="profile-root" tabindex="-1" hidden></main>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-container" aria-live="polite"></div>
</body>
</html>
