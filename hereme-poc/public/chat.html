<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1113">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/pwa/icon-192.png">
  <title>Chat · HerEme</title>
  <script src="/preferences.js"></script>
  <script src="/i18n/i18n.js" defer></script>
  <script src="/i18n/selector.js" defer></script>
  <script src="/passkeys.js" defer></script>
  <script src="/auth.js" defer></script>
  <script src="/pwa.js" defer></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/chat.css">
  <script src="/avatar.js" defer></script>
  <script src="/icons.js" defer></script>
  <script src="/chat-render.js" defer></script>
  <script src="/chat.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#conversationList">Hopp til samtaler</a>
  <main class="chat-shell" id="chatShell">
    <aside class="chat-inbox" aria-label="Chat-innboks">
      <header class="inbox-header">
        <div class="inbox-top"><a class="wall-link" href="/" aria-label="Plakatveggen" title="Plakatveggen"><img src="/assets/icons/chat-back-arrow.svg" alt=""></a><div class="inbox-heading"><h1>Chat</h1><span id="unreadCount" class="unread-count" hidden></span></div></div>
        <div class="search-line">
          <label class="sr-only" for="usernameSearch">Søk etter brukernavn</label>
          <input id="usernameSearch" type="search" autocomplete="off" spellcheck="false" placeholder="Søk etter brukernavn…" aria-controls="searchResults" aria-expanded="false">
          <button id="createGroup" class="icon-button group-add" type="button" aria-label="Opprett gruppe" title="Opprett gruppe"><img src="/assets/icons/chat-group-create.svg" alt=""></button>
        </div>
        <div id="searchResults" class="search-results" role="listbox" aria-label="Brukerforslag" hidden></div>
        <div id="searchStatus" class="search-status" role="status" aria-live="polite"></div>
      </header>
      <section id="groupBuilder" class="group-builder" aria-label="Opprett gruppe" hidden>
        <div class="builder-heading"><h2>Ny gruppe</h2><button id="cancelGroup" type="button">Avbryt</button></div>
        <label for="groupName">Gruppenavn (valgfritt)</label><input id="groupName" maxlength="80" placeholder="Navn på gruppen">
        <p>Finn og velg personer én om gangen i søkefeltet over.</p>
        <h3>Valgte deltakere</h3><div id="selectedPeople" class="selected-people" aria-live="polite"></div>
        <button id="confirmGroup" type="button" class="primary-action" disabled>Opprett gruppe</button>
      </section>
      <nav id="conversationList" class="conversation-list" aria-label="Samtaler"></nav>
      <p id="inboxEmpty" class="empty-state" hidden>Søk etter en bruker eller opprett en gruppe.</p>
    </aside>
    <section class="conversation" id="conversation" aria-label="Samtale">
      <div id="conversationEmpty" class="conversation-empty">Velg en samtale eller søk etter en bruker.</div>
      <div id="conversationContent" class="conversation-content" hidden>
        <header class="conversation-header">
          <button id="backToInbox" class="back-button" type="button" aria-label="Tilbake til samtaler"><img src="/assets/icons/chat-back-arrow.svg" alt=""></button>
          <span id="conversationAvatar" class="conversation-avatar" aria-hidden="true"></span>
          <div class="conversation-heading"><h2 id="conversationTitle" tabindex="-1"></h2><span id="conversationSubtitle"></span></div>
          <button id="toggleDetails" type="button" class="details-button" aria-label="Detaljer" aria-controls="conversationDetails" aria-expanded="false"><img src="/assets/icons/chat-chevron-down.svg" alt=""></button>
        </header>
        <div id="conversationNotice" class="conversation-notice" role="status" hidden></div>
        <div id="decisionActions" class="decision-actions" hidden><button id="acceptInvite" class="primary-action" type="button">Godta</button><button id="declineInvite" type="button">Avslå</button></div>
        <div id="conversationDetails" class="conversation-details" hidden>
          <label class="presence-control"><input id="visible" type="checkbox"> Vis meg som online</label>
          <h3>Personer</h3><div id="people"></div>
          <div id="pendingInvites"></div>
          <form id="inviteForm" hidden><label for="inviteName">Inviter brukernavn</label><input id="inviteName" required minlength="2"><button type="submit">Inviter</button></form>
          <button id="leaveChat" type="button">Forlat samtalen</button>
        </div>
        <button id="olderMessages" class="older-messages" type="button" hidden>Vis eldre meldinger</button>
        <div id="messages" class="message-list" role="log" aria-live="polite" aria-relevant="additions"></div>
        <button id="newMessages" class="new-messages" type="button" hidden></button>
        <div class="composer-wrap">
          <form id="messageForm"><div class="message-form"><div class="attachment-controls"><button class="attachment-button" id="toggleAttachments" type="button" aria-label="Legg ved" aria-controls="attachmentPopover" aria-expanded="false"><img src="/assets/icons/chat-attach-plus.svg" alt=""></button><div id="attachmentPopover" class="attachment-popover" role="group" aria-label="Vedleggsvalg" hidden><button class="attachment-choice" id="pickImage" type="button"><img src="/assets/icons/chat-take-photo.svg" alt=""><span></span></button><button class="attachment-choice" id="pickVideo" type="button"><img src="/assets/icons/chat-record-video.svg" alt=""><span></span></button><button class="attachment-choice" id="pickFile" type="button"><img src="/assets/icons/chat-choose-device.svg" alt=""><span></span></button><small id="attachmentRetention">Filer slettes etter 7 dager</small></div></div><label class="sr-only" for="messageInput">Melding</label><textarea id="messageInput" rows="1" maxlength="5000" placeholder="Skriv en melding…"></textarea><button id="sendMessage" class="primary-action" type="submit" disabled>Send</button></div>
            <div id="stagedFiles" class="staged-files" aria-live="polite" hidden></div><progress id="uploadProgress" max="100" value="0" hidden></progress><button id="pauseUpload" type="button" hidden>Pause</button><span id="uploadStatus" role="status"></span>
          </form>
          <input id="imageInput" type="file" accept="image/*" capture="environment" hidden><input id="videoInput" type="file" accept="video/*" capture="environment" hidden><input id="fileInput" type="file" multiple hidden>
        </div>
      </div>
    </section>
  </main>
  <div id="chatError" class="chat-error" role="alert" hidden></div>
  <div id="connectionStatus" class="connection-status" role="status" hidden>Kobler til chat…</div>
  <dialog id="attachmentViewer" aria-label="Vedlegg"><header><strong id="viewerTitle">Vedlegg</strong><button id="closeViewer" type="button">Lukk</button></header><div id="viewerBody"></div></dialog>
</body>
</html>
