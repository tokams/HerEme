<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat · HerEme</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/chat.css"><script src="/chat.js" defer></script></head><body><main class="chat-app"><header><a href="/">← Plakatveggen</a><h1>Chat</h1><label><input id="visible" type="checkbox"> Vis meg som online</label></header><div id="error" role="alert"></div><div class="chat-grid"><aside><h2>Finn bruker</h2><form id="find"><input id="query" placeholder="Søk pseudonym" minlength="2" required><button>Søk</button></form><div id="results"></div><h2>Forespørsler</h2><div id="requests"></div><h2>Grupper</h2><form id="group"><input id="groupName" placeholder="Gruppenavn" required><input id="groupUsers" placeholder="Pseudonymer, separert med komma" required><input id="groupOpening" placeholder="Første melding (valgfritt)"><button>Opprett gruppe</button></form><h2>Samtaler</h2><div id="conversations"></div></aside><section><h2 id="chatTitle">Velg en samtale</h2><div id="people"></div><form id="invite" hidden><input id="inviteName" placeholder="Inviter pseudonym" required><button>Inviter</button></form><div id="pendingInvites"></div><button id="leave" hidden>Forlat samtalen</button><button id="older" hidden>Vis eldre meldinger</button><div id="messages" aria-live="polite"></div><form id="send"><input id="message" placeholder="Skriv en melding" maxlength="5000" required><button>Send</button></form><label class="file-button">Del fil (slettes etter 7 dager)<input id="file" type="file"></label><progress id="progress" value="0" max="100" hidden></progress><button id="pause" hidden>Pause opplasting</button><span id="uploadState"></span></section></div></main></body></html>
